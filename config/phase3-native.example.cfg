# Merge into the generated native CConfig. Restart for these settings.
# The supervisor owns paths, publication/auth feedback and process lifecycle.
bot_hostport = 6113
bot_maxplayers = 12
bot_autostartplayers = 10
bot_countdownseconds = 5

bot_vote_enabled = true
bot_vote_required_percent = 60
bot_vote_min_players = 2
bot_vote_timeout = 60
bot_vote_cooldown = 30

bot_lobby_refresh_enabled = true
bot_lobby_refresh_interval = 10
bot_lobby_refresh_mode = slot_toggle

bot_statusname = War3 Dedicated
bot_externalstatuspath = /data/state/bridge/native-feedback.cfg

# Existing native latest-state publication mailbox remains unchanged.
bot_externalpublishpath = /data/state/bridge/native-intent.json
bot_externalpublishrealm = iCCup
# Supply bot_externalpublishhostname privately through the supervisor.

# Existing GHost autohost mechanism. The supervisor supplies name/owner privately.
# autohost_startplayers overrides bot_autostartplayers for autohosted lobbies.
autohost_maxgames = 1
autohost_startplayers = 10
